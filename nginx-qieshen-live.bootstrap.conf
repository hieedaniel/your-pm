# 切身产品经理 · Nginx 第一步配置（只有 HTTP，用于签发证书）
#
# 用法（服务器上）：
#   cp nginx-qieshen-live.bootstrap.conf /etc/nginx/conf.d/qieshen-live.conf
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d se.seveninfo.cn        # 由 certbot 自动补出 443 段
#
# 为什么先不用 443：证书还没签出来时，ssl_certificate 指向的文件不存在，
# nginx -t 会直接失败，certbot 也跟着报 "The nginx plugin is not working"。
# 这一份故意不含 ssl / 不含证书路径，证书签好后再由 certbot 自己加。
#
# 注意：不要写 `http2 on;`（nginx 1.25.1+ 才支持）。要 HTTP/2 就用
# `listen 443 ssl http2;`，老版本也认。

upstream qieshen_live {
    server 127.0.0.1:19535;
    keepalive 16;
}

server {
    listen 80;
    server_name se.seveninfo.cn;

    # 音频是二进制帧，别让 nginx 再压一遍
    gzip off;
    client_max_body_size 8m;

    # ---------- SSE：/events ----------
    # proxy_buffering 开着会攒缓冲，现场表现＝录音时字幕卡住、过一会儿一次性冒出来
    location = /events {
        proxy_pass http://qieshen_live;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- WebSocket：/audio ----------
    location = /audio {
        proxy_pass http://qieshen_live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---------- 页面与接口 ----------
    location / {
        proxy_pass http://qieshen_live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 服务没有登录态，公网暴露前建议加一层口令：
    #   apt install -y apache2-utils && htpasswd -c /etc/nginx/.htpasswd demo
    # auth_basic "restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
