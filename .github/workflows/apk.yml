name: apk

# 手机端 APK：只有 android/ 改动才重建，避免改服务端代码时白跑一次 Android 构建。
# 产物：Actions 页面该次 Run 底部的 Artifacts → app-debug.apk

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 JDK 17（AGP 8.5 要求 17）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Gradle（工程里不放 wrapper，省掉二进制 jar）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 看一眼 Android SDK（Runner 自带，缺东西时这行日志能直接看出来）
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: 构建 debug APK
        run: gradle -p android --no-daemon --stacktrace assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 打 tag 时同时挂到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true

      - name: 输出提示
        run: |
          {
            echo "### APK 已生成"
            echo ""
            echo "在该次 Run 底部 **Artifacts → app-debug** 下载，手机允许「安装未知来源应用」后直接装。"
            echo ""
            echo "首次打开会要求填服务端地址，默认 \`https://se.seveninfo.cn/\`，"
            echo "点「开始录音」时授予麦克风权限即可。"
          } >> "$GITHUB_STEP_SUMMARY"
