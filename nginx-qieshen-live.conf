# 切身产品经理 · 实时音频链路 · Nginx 反代示例
#
# 为什么需要它：
#   1) 浏览器 getUserMedia 只在 https 或 localhost 下可用 —— 直接 http://IP:19535
#      打开，点「开始录音」会立刻报 "getUserMedia unavailable"。
#   2) 这个站内有两类长连接：WS /audio（音频上行）和 SSE /events（字幕/卡片），
#      反代配置不对就会表现为「连上了但一句话都不出」。
#
# 放到 /etc/nginx/conf.d/qieshen-live.conf，把域名和证书路径换成你自己的。
#
# 顺序别搞反（否则 nginx -t 一定过不去）：
#   1) 先只放下面「HTTP-only」那一段（listen 80，不含 ssl、不含证书路径）
#   2) nginx -t && systemctl reload nginx
#   3) certbot --nginx -d 你的域名   —— 由它签证书并自动补出 443 段
#   4) 再把本文件里 443 段的 location 调优项对齐过去
#
# 反例：直接把带 ssl_certificate 的 443 段放进去，证书还不存在 → nginx -t 报
# 「cannot load certificate ... No such file or directory」，certbot 也跟着做不了事。

# ---------- 上游 ----------
upstream qieshen_live {
    server 127.0.0.1:19535;
    keepalive 16;
}

server {
    listen 80;
    server_name pm.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # 不要写成单独的 `http2 on;`：那是 nginx 1.25.1 才有的指令，
    # 老版本（Debian/Ubuntu 自带 1.18/1.22、CentOS 1.20）会直接 nginx -t 报
    # unknown directive "http2"。要用 HTTP/2 就写 `listen 443 ssl http2;`，
    # 新版本只给一条 deprecated 警告，不影响启动。
    # 这里默认不开 HTTP/2：本服务的瓶颈是 ASR 和模型，不是传输层。
    server_name pm.example.com;

    ssl_certificate     /etc/letsencrypt/live/pm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pm.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 音频是二进制帧，别让网关自己再压一遍
    gzip off;
    client_max_body_size 8m;

    # ---------- SSE：/events ----------
    # 必须单独一段：proxy_buffering 开着的话 nginx 会攒够缓冲才往下发，
    # 现场表现就是「录音时字幕卡住、过一会儿一次性冒出来」。
    location = /events {
        proxy_pass http://qieshen_live;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;      # 长连接，别 60 秒就掐
        proxy_send_timeout 3600s;
    }

    # ---------- WebSocket：/audio ----------
    location = /audio {
        proxy_pass http://qieshen_live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---------- 其余（页面 / 接口）----------
    location / {
        proxy_pass http://qieshen_live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 服务没有登录态，公网暴露前建议至少加一层口令：
    #   apt install apache2-utils && htpasswd -c /etc/nginx/.htpasswd demo
    # auth_basic "restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
