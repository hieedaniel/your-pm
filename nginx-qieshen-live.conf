# 切身产品经理 · 实时音频链路 · Nginx 反代示例
#
# 为什么需要它：
#   1) 浏览器 getUserMedia 只在 https 或 localhost 下可用 —— 直接 http://IP:19535
#      打开，点「开始录音」会立刻报 "getUserMedia unavailable"。
#   2) 这个站内有两类长连接：WS /audio（音频上行）和 SSE /events（字幕/卡片），
#      反代配置不对就会表现为「连上了但一句话都不出」。
#
# 放到 /etc/nginx/conf.d/qieshen-live.conf，把域名和证书路径换成你自己的。

# ---------- 上游 ----------
upstream qieshen_live {
    server 127.0.0.1:19535;
    keepalive 16;
}

server {
    listen 80;
    server_name pm.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pm.example.com;

    ssl_certificate     /etc/letsencrypt/live/pm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pm.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 音频是二进制帧，别让网关自己再压一遍
    gzip off;
    client_max_body_size 8m;

    # ---------- SSE：/events ----------
    # 必须单独一段：proxy_buffering 开着的话 nginx 会攒够缓冲才往下发，
    # 现场表现就是「录音时字幕卡住、过一会儿一次性冒出来」。
    location = /events {
        proxy_pass http://qieshen_live;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;      # 长连接，别 60 秒就掐
        proxy_send_timeout 3600s;
    }

    # ---------- WebSocket：/audio ----------
    location = /audio {
        proxy_pass http://qieshen_live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---------- 其余（页面 / 接口）----------
    location / {
        proxy_pass http://qieshen_live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 服务没有登录态，公网暴露前建议至少加一层口令：
    #   apt install apache2-utils && htpasswd -c /etc/nginx/.htpasswd demo
    # auth_basic "restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
